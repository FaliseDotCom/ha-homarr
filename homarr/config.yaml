name: Homarr
version: "2.7.0"
slug: homarr
description: A sleek, modern dashboard for your home lab and its services.
url: https://github.com/FaliseDotCom/ha-homarr/tree/main/homarr
homeassistant: 2026.7.0
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
timeout: 30
backup: cold
map:
  - type: data
    path: /appdata
ports:
  7575/tcp: 7575
webui: http://[HOST]:[PORT:7575]
watchdog: tcp://[HOST]:[PORT:7575]
options:
  log_level: info
  no_external_connection: false
  env_vars: []
schema:
  log_level: list(debug|info|warn|error)
  no_external_connection: bool
  base_url: str?
  trusted_proxies: str?
  env_vars:
    - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
      value: str
